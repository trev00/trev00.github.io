<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fishing — Trevor Tuck</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous">
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://server.arcgisonline.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&display=swap">
  <!-- Classic scripts, since leaflet.heat needs L as a global. Deferred scripts
       and modules run in document order, so both are loaded before fishing.js. -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js" integrity="sha384-mFKkGiGvT5vo1fEyGCD3hshDdKmW3wzXW/x+fWriYJArD0R3gawT6lMvLboM22c0" crossorigin="anonymous"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="wrap">
    <div id="sidebar"></div>
    <main>
      <!-- A dashboard, not a report: the map is the one hero, with the totals
           above it, and the trips are a feed of cards beside it on a wide
           screen (styles.css, .dash). Hovering a card lights that trip's spots
           on the map. -->
      <article class="fishing">
        <!-- On a wide screen the cover, totals and map hold still while the
             page scrolls, and the scroll moves the trips instead; once the
             last trip is in view the page carries on down (styles.css, .pin;
             fishing.js, pinTrips). Anywhere else these two are plain blocks. -->
        <div class="pin-track" id="pin-track">
          <div class="pin">
            <!-- The cover, from tools/prep_photos.py --cover, as a slim band
                 behind the title. object-position keeps the horizon in frame as
                 the banner crops; if the files are missing the image removes
                 itself and the title shows plain. -->
            <header class="cover slim">
              <img src="/fishing/images/cover-1600.jpg"
                   srcset="/fishing/images/cover-960.jpg 960w, /fishing/images/cover-1600.jpg 1600w, /fishing/images/cover-3200.jpg 3200w"
                   sizes="(max-width: 800px) 100vw, 1400px" alt="The sun setting on the horizon over the water"
                   fetchpriority="high" style="object-position: 50% 58%" onerror="this.remove()">
              <h1>Fishing</h1>
            </header>

            <div class="dash">
              <div class="map-col">
                <div class="stats" id="stats" role="list" aria-label="Totals"></div>
                <div class="fishmap" id="fish-map" role="region" aria-label="Map of logged fishing spots"></div>
              </div>

              <section class="trips-col" id="trips-col">
                <h2>Trips</h2>
                <div id="trips"></div>
              </section>
            </div>
          </div>
        </div>

        <!-- The viewer: one photo at a time, with the arrows and the arrow
             keys stepping through every photo on the page. -->
        <dialog class="photo-view" id="photo-view" aria-label="Photo">
          <form method="dialog"><button class="close" aria-label="Close">&times;</button></form>
          <button type="button" class="step prev" aria-label="Previous photo">&#8249;</button>
          <button type="button" class="step next" aria-label="Next photo">&#8250;</button>
          <figure><img alt=""><figcaption><span class="cap"></span><span class="count"></span></figcaption></figure>
        </dialog>

        <section class="season-sec">
          <h2>What's Biting</h2>
          <figure class="box">
            <div class="chart-legend" aria-hidden="true">
              <span><i class="swatch l0"></i>Rare</span>
              <span><i class="swatch l1"></i>Fair</span>
              <span><i class="swatch l2"></i>Good</span>
              <span><i class="swatch l3"></i>Peak</span>
              <span><i class="swatch closed">×</i>Closed</span>
            </div>
            <div class="season-wrap">
              <table class="season" id="season"></table>
              <div class="chart-tip" hidden></div>
            </div>
            <figcaption>Seasonality by species and month near the Port of Los Angeles. &times; marks
              a closed season; a count after a name is how many of that species this log has caught.
              Hover a cell for details.</figcaption>
          </figure>
        </section>

      </article>
    </main>
  </div>
  <script type="module" src="/site.js"></script>
  <script type="module" src="/fishing/fishing.js"></script>
</body>
</html>
